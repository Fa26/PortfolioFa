<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>FATIMA</title>
<meta name="description" content="Portafolio de neurociencia: cerebro de fibras y neurona en 3D">
<!--<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧠</text></svg>">-->
<style>
:root{--bg:#000;--fg:#eaf2ff;--pill:rgba(20,22,34,.75);--bd:rgba(255,255,255,.2);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
canvas{display:block;width:100%;height:100%}
#ui{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;padding:14px;display:flex;flex-wrap:wrap;gap:8px;pointer-events:none}
#listInfo{display: flex; justify-content: space-between;}
button{pointer-events:auto;cursor:pointer;font:inherit;font-size:14px;background:var(--pill);color:var(--fg);border:1px solid var(--bd);padding:8px 14px;border-radius:999px;backdrop-filter:blur(6px)}
button.on{background:#eaf2ff;color:#0b1020}
#title{position:fixed;left:28px;bottom:calc(30px + env(safe-area-inset-bottom,0px));pointer-events:none;text-shadow:0 2px 20px #000}
#title h2{margin:0;font-size:clamp(28px,5vw,56px);letter-spacing:.12em;font-weight:300}
#aboutMe{position:fixed;right:20px;top:calc(30px + env(safe-area-inset-bottom,0px));opacity:.55;font-size:12px;text-align:right;max-width:40vw;pointer-events:none}
#title p{margin:6px 0 0;opacity:.7;letter-spacing:.2em;font-size:clamp(11px,1.4vw,14px);text-transform:uppercase}
#hint{position:fixed;right:20px;bottom:calc(30px + env(safe-area-inset-bottom,0px));opacity:.55;font-size:12px;text-align:right;max-width:40vw;pointer-events:none}
#fab{position:fixed;right:20px;bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:5;padding:11px 18px;font-size:15px;background:#eaf2ff;color:#0b1020;border:0;box-shadow:0 0 28px rgba(120,160,255,.45)}

#chat{position:fixed;right:20px;bottom:calc(128px + env(safe-area-inset-bottom,0px));z-index:5;width:min(380px,92vw);height:min(500px,62vh);display:none;flex-direction:column;background:rgba(10,12,22,.82);border:1px solid var(--bd);border-radius:18px;backdrop-filter:blur(14px);overflow:hidden;box-shadow:0 10px 50px rgba(0,0,0,.6)}
#chat.open{display:flex}
#chat header{padding:12px 16px;border-bottom:1px solid var(--bd);font-size:14px;display:flex;justify-content:space-between;align-items:center}
#chat header span{opacity:.6;font-size:12px}
#msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.m{max-width:85%;padding:9px 13px;border-radius:14px;font-size:14px;line-height:1.45;white-space:pre-wrap}
.m.b{align-self:flex-start;background:rgba(255,255,255,.1)}
.m.u{align-self:flex-end;background:#eaf2ff;color:#0b1020}
.dots span{display:inline-block;width:6px;height:6px;margin:0 2px;border-radius:50%;background:#9db4ff;animation:bl 1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,60%,100%{opacity:.25}30%{opacity:1}}
#chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 10px}
#chips button{font-size:12px;padding:5px 11px}
#chat form{display:flex;gap:8px;padding:10px;border-top:1px solid var(--bd)}
#chat input{flex:1;font:inherit;font-size:14px;background:rgba(255,255,255,.08);color:var(--fg);border:1px solid var(--bd);border-radius:999px;padding:9px 14px;outline:none}
#chat input:focus{border-color:#9db4ff}
@media(max-width:520px){#hint{display:none}}
</style>
</head>
<body>
<div id="ui">
  <button id="bBrain" class="on">🧠 Brain</button>
  <button id="bNeuron">🔬 Neuron</button>
  <button id="bFall">↻ Reassemble</button>
  <button id="bFire">⚡ Pulse</button>
</div>
<div id="aboutMe">
  <button>Roast your Code</button>
  <button>PipeLine</button>
</div>
<div id="title"><h2>Fatima</h2><p>Developer </p></div>
<div id="hint">Move the mouse to rotate<br>click: fire a pulse · scroll: zoom</div>
<button id="fab" aria-label="Open chat">💬 Ask me</button>
<section id="chat" aria-label="Portfolio chat">
  <header>Fatima’s assistant <span>local answers</span></header>
  <div id="msgs" aria-live="polite"></div>
  <div id="chips"></div>
  <form id="cf"><input id="ci" autocomplete="off" placeholder="Type your question…" aria-label="Your question"><button type="submit">Send</button></form>
</section>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
(function(){
const $=id=>document.getElementById(id);
const V=THREE.Vector3,R=Math.random,rv=s=>new V(R()-.5,R()-.5,R()-.5).multiplyScalar(s);
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.setClearColor(0x000000,1);
document.body.prepend(renderer.domElement);
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,.1,100);camera.position.z=9.5;
const group=new THREE.Group();scene.add(group);

const shared={uT:{value:0},uTime:{value:0},uFire:{value:-100}};
const VERT=`
uniform float uT,uTime,uFire,uAmb;
attribute vec3 aColor,aOff;attribute float aDelay,aD,aPh;
varying vec3 vC;varying float vP;
void main(){
  float t=clamp((uT-aDelay)/1.2,0.,1.);
  float e=1.-pow(1.-t,3.);
  vec3 p=position+aOff*(1.-e);
  float amb=pow(.5+.5*sin(aD*2.5-uTime*2.+aPh),10.)*uAmb;
  float f=exp(-pow((aD-(uTime-uFire)*5.)*.9,2.));
  vP=max(amb,f*2.);
  vC=aColor*(.3+.7*t);
  gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.);
}`;
const FRAG=`varying vec3 vC;varying float vP;void main(){gl_FragColor=vec4(vC*(.5+1.9*vP),.7);}`;
const mat=a=>new THREE.ShaderMaterial({uniforms:{uT:shared.uT,uTime:shared.uTime,uFire:shared.uFire,uAmb:{value:reduced?0:a}},vertexShader:VERT,fragmentShader:FRAG,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending});

function Builder(){
  const P=[],C=[],O=[],L=[],D=[],H=[];
  return{
    push(a,b,c0,c1,o,dl,d0,d1,p){P.push(a.x,a.y,a.z,b.x,b.y,b.z);C.push(...c0,...c1);O.push(...o,...o);L.push(dl,dl);D.push(d0,d1);H.push(p,p)},
    geo(){const g=new THREE.BufferGeometry(),f=(n,a,s)=>g.setAttribute(n,new THREE.Float32BufferAttribute(a,s));
      f('position',P,3);f('aColor',C,3);f('aOff',O,3);f('aDelay',L,1);f('aD',D,1);f('aPh',H,1);return g}
  };
}

// ---------- CEREBRO ----------
function surf(){const u=R()*6.283,v=Math.acos(2*R()-1);let y=Math.cos(v)*1.8;if(y<0)y*=.5;return new V(Math.sin(v)*Math.cos(u)*1.7,y,Math.sin(v)*Math.sin(u)*3.0)}
function dirCol(d){const w=R()*.35,c=[Math.pow(Math.abs(d.x),.6),Math.pow(Math.abs(d.z),.6),Math.pow(Math.abs(d.y),.6)];return c.map(x=>x*(1-w)+w)}
function brainGeo(){
  const B=Builder(),S=22;
  for(let i=0;i<3200;i++){
    const k=R();let a=surf(),b,c;
    if(k<.28){b=a.clone();b.x=-b.x;c=new V(0,Math.abs(a.y)*.5+.9,a.z*.8)}
    else if(k<.62){b=a.clone();b.z+=(R()<.5?-1:1)*(1+R()*1.6);b.y*=.9;c=a.clone().add(b).multiplyScalar(.35)}
    else{a.y=Math.abs(a.y);b=new V(a.x*.25,-1.9,a.z*.2-.3);c=new V(a.x*.55,.2,a.z*.6)}
    const n=rv(.7),o=[(R()-.5)*6,7+R()*6,(R()-.5)*6],dl=R()*1.3,ph=R()*6.28;
    let prev=null;
    for(let s=0;s<=S;s++){const t=s/S,q=a.clone().multiplyScalar((1-t)*(1-t)).add(c.clone().multiplyScalar(2*(1-t)*t)).add(b.clone().multiplyScalar(t*t)).addScaledVector(n,Math.sin(t*Math.PI));
      if(prev){const cl=dirCol(q.clone().sub(prev).normalize());B.push(prev,q,cl,cl,o,dl,prev.z+3+t,q.z+3+t,ph)}prev=q}
  }
  for(let i=0;i<5500;i++){
    const s=surf(),inn=s.clone().multiplyScalar(.8),out=s.clone().multiplyScalar(1.05+R()*.08),bend=rv(.3);
    const o=[(R()-.5)*6,7+R()*6,(R()-.5)*6],dl=1+R()*.9,ph=R()*6.28;let prev=inn;
    for(let k=1;k<=5;k++){const t=k/5,q=inn.clone().lerp(out,t).addScaledVector(bend,Math.sin(t*Math.PI)),cl=dirCol(q.clone().sub(prev).normalize());
      B.push(prev,q,cl,cl,o,dl,prev.z+3,q.z+3,ph);prev=q}
  }
  return B.geo();
}
const brain=new THREE.LineSegments(brainGeo(),mat(.6));brain.rotation.y=Math.PI/2;group.add(brain);

// ---------- NEURONA ----------
function neuronGeo(){
  const B=Builder();
  function seg(a,b,c0,c1,o,dl,d0,d1,p){for(let k=0;k<2;k++){const j=rv(k*.05);B.push(a.clone().add(j),b.clone().add(j),c0,c1,o,dl,d0,d1,p)}}
  function br(p,dir,len,depth,d0,cf,o,steps,wob,ph){
    let q=p.clone(),d=d0;const h=len/steps;
    for(let i=0;i<steps;i++){dir.add(rv(wob)).normalize();const n=q.clone().addScaledVector(dir,h);seg(q,n,cf(d),cf(d+h),o,Math.min(1.4,d/14*1.3),d,d+h,ph);q=n;d+=h}
    if(depth>0){const kids=depth>2?2:(R()<.5?2:3);for(let k=0;k<kids;k++)br(q,dir.clone().add(rv(1.3)).normalize(),len*.7,depth-1,d,cf,o,Math.max(4,steps-2),wob,ph)}
    return{q,d};
  }
  const dend=d=>{const t=Math.min(1,d/9);return[.45+.55*t,.85-.45*t,1-.3*t]};
  const axon=d=>[1,.78-.2*Math.min(1,d/16),.25];
  for(let i=0;i<7;i++){const dir=new V(R()-.5,R()*.9-.1,R()-.5).normalize();
    br(new V(0,2,0).addScaledVector(dir,.4),dir,2.3,4,.4,dend,[(R()-.5)*5,6+R()*4,(R()-.5)*5],9,.5,R()*6.28)}
  const ax=br(new V(0,1.6,0),new V(.1,-1,0).normalize(),9,0,.4,axon,[0,-6,0],30,.12,1);
  for(let i=0;i<5;i++){const dir=new V(R()-.5,-1,R()-.5).normalize();br(ax.q,dir,1.7,2,ax.d,axon,[0,-6,0],8,.35,1)}
  for(let i=0;i<500;i++){const d=rv(1).normalize(),a=new V(0,2,0).addScaledVector(d,.28),b=new V(0,2,0).addScaledVector(d,.45+R()*.15);
    B.push(a,b,[1,.9,.7],[1,.9,.7],[d.x*3,d.y*3,d.z*3],0,0,.3,0)}
  return B.geo();
}
const neuron=new THREE.LineSegments(neuronGeo(),mat(.3));neuron.position.y=1;neuron.visible=false;group.add(neuron);

// ---------- Interacción ----------
let mx=0,my=0,idle=0,yaw=0,pitch=0,base=0,zoom=1,mode='brain',t0=performance.now();
const fire=()=>{shared.uFire.value=performance.now()/1000};
function setMode(m){mode=m;brain.visible=m==='brain';neuron.visible=m==='neuron';t0=performance.now();
  $('bBrain').classList.toggle('on',m==='brain');$('bNeuron').classList.toggle('on',m==='neuron');if(m==='neuron')setTimeout(fire,2600)}
$('bBrain').onclick=()=>setMode('brain');$('bNeuron').onclick=()=>setMode('neuron');
$('bFall').onclick=()=>{t0=performance.now()};$('bFire').onclick=fire;
const cv=renderer.domElement;
addEventListener('pointermove',e=>{mx=e.clientX/innerWidth*2-1;my=e.clientY/innerHeight*2-1;idle=0});
cv.addEventListener('click',fire);
cv.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.min(1.8,Math.max(.5,zoom+e.deltaY*.001))},{passive:false});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
setInterval(()=>{if(mode==='neuron')fire()},4200);

// ================= CHAT (no server, no cost) =================
// EDIT THIS LIST WITH YOUR INFO. k = keywords, a = answer, act = optional action.
const KB=[
 {k:['hi','hello','hey','greetings','good morning','good afternoon','whats up'],a:'Hi! 👋 I’m the assistant for Fatima’s portfolio. Ask me about their background, projects, skills or how to get in touch.'},
 {k:['who are you','who is','introduce yourself','about you','about me','profile','what do you do','bio'],a:'Fatima is a developer passionate about neuroscience and technology. They love understanding how neurons connect and turning that complexity into interactive visualizations.'},
 {k:['education','studied','study','degree','university','college','school','masters','phd','bachelor','courses','certifications'],a:'Education: Computer Science at UNANM . Courses and certifications: [course 1], [course 2].'},
 {k:['skills','technologies','tech stack','stack','programming','python','javascript','react','tools','abilities','expertise'],a:'Skills: Python, JavaScript/React, Three.js, data analysis, [neuroimaging / EEG / whatever you know]. Always learning something new.'},
 {k:['projects','research','built','developed','publications','thesis','what have you made','what have you built'],a:'Highlighted projects:\n• [Project 1]: short description.\n• [Project 2]: short description.\n• This portfolio: a fiber brain and a neuron in 3D.'},
 {k:['experience','worked','job','jobs','employment','company','internship','lab','career','work history'],a:'Experience: [Role] at [Place] ([year]–[year]), where [what you did].'},
 {k:['neuroscience','brain','neurons','tractography','connectome','fibers','interests','interested'],a:'I’m fascinated by brain connectivity: how millions of fibers form networks that think. Watch the brain light up! ⚡',act:'fire'},
 {k:['show neuron','show me the neuron','switch to neuron','neuron','dendrites','axon'],a:'Here’s a neuron with its dendrites and its axon firing signals 🔬',act:'neuron'},
 {k:['show brain','back to brain','show me the brain','switch to brain','go back to brain'],a:'Back to the fiber brain 🧠',act:'brain'},
 {k:['how did you build','how is this made','built with','three','threejs','webgl','this page','this site','technology behind'],a:'This page is built with Three.js: thousands of lines with a custom shader for the falling animation and the light pulses. Color follows each fiber’s direction, just like in tractography.'},
 {k:['contact','email','mail','reach','linkedin','github','social','message','get in touch'],a:'You can write to [faaaa26@gmail.com], or find them on LinkedIn ([link]) and GitHub ([link]).'},
 {k:['available','hire','hiring','freelance','collaborate','collaboration','opportunities','open to work','job offer'],a:'Yes, they’re open to collaborations and proposals. The best way is to email them with the details.'},
 {k:['languages','what languages','do you speak','speak','english','spanish'],a:'Spanish (native) and English ([level]).'},
 {k:['where do you live','location','city','country','live','based'],a:'Based in [City, Country], and works remotely when possible.'},
 {k:['thanks','thank you','great','awesome','cool','amazing','nice'],a:'You’re welcome! 😊 If you want to know anything else, I’m here.'},
 {k:['bye','goodbye','see you','later','farewell'],a:'See you soon! 👋 Thanks for visiting the portfolio.'}
];
const FALLBACK='Hmm, I don’t have that noted down 🤔. Try one of these questions, or email them directly.';
const CHIPS=['Who are you?','Education','Projects','Skills','Contact','Show neuron'];
const norm=t=>t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
function lev(a,b){const d=[];for(let i=0;i<=a.length;i++)d[i]=[i];for(let j=0;j<=b.length;j++)d[0][j]=j;
  for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length]}
function match(text){
  const q=norm(text),w=q.split(' ').filter(Boolean);let best=null,bs=0;
  for(const e of KB){let s=0;
    for(const k of e.k){const nk=norm(k);
      if(nk.includes(' ')){if(q.includes(nk))s+=3}
      else if(w.includes(nk))s+=2;
      else if(nk.length>=5)for(const x of w)if(x.length>=5&&lev(x,nk)<=1){s+=1.2;break}}
    if(s>bs){bs=s;best=e}}
  return bs>=1.2?best:null;
}
const chat=$('chat'),msgs=$('msgs'),ci=$('ci');let greeted=false,busy=false;
function addMsg(role,text){const d=document.createElement('div');d.className='m '+role;d.textContent=text;msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight;return d}
function chips(){const c=$('chips');c.innerHTML='';CHIPS.forEach(t=>{const b=document.createElement('button');b.type='button';b.textContent=t;b.onclick=()=>ask(t);c.appendChild(b)})}
function reply(text,act){
  busy=true;const d=addMsg('b','');d.innerHTML='<span class="dots"><span></span><span></span><span></span></span>';
  setTimeout(()=>{d.textContent='';fire();
    if(act==='neuron')setMode('neuron');else if(act==='brain')setMode('brain');else if(act==='fire')setTimeout(fire,300);
    if(reduced){d.textContent=text;busy=false;msgs.scrollTop=msgs.scrollHeight;return}
    let i=0;const iv=setInterval(()=>{i+=2;d.textContent=text.slice(0,i);msgs.scrollTop=msgs.scrollHeight;if(i>=text.length){clearInterval(iv);busy=false}},14)},550+Math.random()*350);
}
function ask(text){text=text.trim();if(!text||busy)return;addMsg('u',text);const m=match(text);m?reply(m.a,m.act):reply(FALLBACK)}
$('cf').addEventListener('submit',e=>{e.preventDefault();const v=ci.value;ci.value='';ask(v)});
$('fab').onclick=()=>{chat.classList.toggle('open');if(chat.classList.contains('open')){ci.focus();if(!greeted){greeted=true;chips();reply('Hi! 👋 I’m Fatima’s portfolio assistant. Ask me anything about their background, or tap a suggestion.')}}};

let last=performance.now();
(function loop(){
  requestAnimationFrame(loop);
  const n=performance.now(),dt=Math.min((n-last)/1000,.05);last=n;
  shared.uTime.value=n/1000;shared.uT.value=reduced?10:(n-t0)/1000;
  idle+=dt;if(idle>3&&!reduced)base+=dt*.15;
  yaw+=((base+mx*.7)-yaw)*.05;pitch+=((my*.25)-pitch)*.05;
  group.rotation.set(pitch,yaw,0);
  const tr=(mode==='brain'?9.5:17)*zoom;camera.position.z+=(tr-camera.position.z)*.06;
  renderer.render(scene,camera);
})();
})();
</script>
</body>
</html>
